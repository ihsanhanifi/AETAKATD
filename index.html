<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E-Tamu Kemenag Kab. Tanah Datar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="logo-container animate-fade-in">
            <img src="kemenag.png" alt="Logo Kemenag">
            <h2>E-Tamu Kementerian Agama<br>Kabupaten Tanah Datar</h2>
        </div>

        <form id="guestForm" class="animate-slide-up">
            <div class="form-group">
                <label for="nama">Nama Lengkap *</label>
                <input type="text" id="nama" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="asal">Berasal Dari *</label>
                <select id="asal" class="form-control" required>
                    <option value="">-- Pilih --</option>
                    <option value="Umum">Umum</option>
                    <option value="Instansi">Instansi</option>
                </select>
            </div>

            <div class="form-group hidden" id="instansiGroup">
                <label for="namaInstansi">Nama Instansi *</label>
                <input type="text" id="namaInstansi" class="form-control">
            </div>

            <div class="form-group">
                <label for="tujuan">Tujuan *</label>
                <select id="tujuan" class="form-control" required>
                    <option value="">-- Pilih Tujuan --</option>
                    <option value="Kepala Kantor">Kepala Kantor</option>
                    <option value="Kasubag TU">Kasubag TU</option>
                    <option value="PTSP">PTSP</option>
                    <option value="Kepegawaian">Kepegawaian</option>
                    <option value="Keuangan">Keuangan</option>
                    <option value="Perencana">Perencana</option>
                    <option value="Humas">Humas</option>
                    <option value="Penerjemah">Penerjemah</option>
                    <option value="Pengawas">Pengawas</option>
                    <option value="PAIS">Pendidikan Agama Islam (PAIS)</option>
                    <option value="PD.PONTREN">Pendidikan Pondok Pesantren (PD.PONTREN)</option>
                    <option value="PENMAD">Pendidikan Madrasah (PENMAD)</option>
                    <option value="BIMAS">Bimbingan Masyarakat Islam (BIMAS)</option>
                    <option value="ZAWA">Penyelenggara Zakat dan Wakaf (ZAWA)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="keperluan">Keperluan *</label>
                <textarea id="keperluan" class="form-control" rows="3" required></textarea>
            </div>

            <div class="form-group">
                <label for="noHp">Nomor Handphone/Whatsapp *</label>
                <input type="tel" id="noHp" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Foto Selfie (Opsional)</label>
                <div class="camera-container">
                    <video id="videoElement" autoplay playsinline></video>
                    <canvas id="canvasElement"></canvas>
                    <img id="photoPreview" alt="Preview Selfie">
                    <br>
                    <button type="button" class="btn-camera" id="btnStartCamera">📷 Aktifkan Kamera</button>
                    <button type="button" class="btn-camera hidden" id="btnCapture">📸 Ambil Foto</button>
                    <button type="button" class="btn-secondary hidden" id="btnRetake">🔄 Ulangi</button>
                    <input type="hidden" id="fotoSelfie" name="fotoSelfie">
                </div>
            </div>

            <button type="submit" class="btn-primary">Kirim Data Tamu</button>
        </form>

        <div class="admin-link">
            <a href="dashboard.html">🔒 Login Admin</a>
        </div>
    </div>

    <footer class="footer">
        Dibuat oleh Ihsan Putra Hanifi, S.Kom<br>
        Pranata Komputer Kantor Kementerian Agama Kab. Tanah Datar
    </footer>

    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <div class="loading-text">Loading / Mengambil data...</div>
    </div>

    <div id="notificationModal" class="modal hidden">
        <div class="modal-content">
            <h3 id="modalTitle">Sukses</h3>
            <p id="modalMessage">Data berhasil disimpan.</p>
            <button class="btn-primary" onclick="closeModal()" style="margin-top: 1rem;">Tutup</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
